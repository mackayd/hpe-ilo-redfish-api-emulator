x-emulator: &emulator
  build: .
  image: ilo-redfish-emulator:local
  restart: unless-stopped
  init: true
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import ssl, urllib.request; urllib.request.urlopen('https://127.0.0.1:8443/redfish/v1/', context=ssl._create_unverified_context(), timeout=5).read()"
    interval: 30s
    timeout: 10s
    start_period: 30s
    retries: 3

services:
  ilo:
    <<: *emulator
    environment:
      MOCKUP_FOLDER: ${MOCKUP_FOLDER:-DL380a_Gen12}
      EXTERNAL_PORT: ${EXTERNAL_PORT:-8443}
      ASYNC_SLEEP: ${ASYNC_SLEEP:-0}
      AUTH_CONFIG: ${AUTH_CONFIG:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${EXTERNAL_PORT:-8443}:8443"

  ilo-dl360:
    <<: *emulator
    profiles: [second]
    environment:
      MOCKUP_FOLDER: DL360
      EXTERNAL_PORT: ${SECOND_PORT:-8444}
      ASYNC_SLEEP: ${ASYNC_SLEEP:-0}
      AUTH_CONFIG: ${AUTH_CONFIG:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SECOND_PORT:-8444}:8443"
